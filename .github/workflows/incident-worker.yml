name: Remote incident worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-worker
  cancel-in-progress: false

jobs:
  incident:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NO_CLOUD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download checksum-verified Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "OLLAMA_MODELS=$RUNNER_TEMP/models" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ollama"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/ollama/ollama/releases/download/v0.40.16/ollama-linux-amd64.tar.zst \
            --output "$RUNNER_TEMP/ollama.tar.zst"
          echo "87bfafb2acbc89b2e6a1be0a9043de6aa75fb450696f86bc426e65fc448f788d  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start local model service
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:11434/api/tags', timeout=2).read()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Model service did not start')
          PY
      - name: Download the free model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen3:8b > "$RUNNER_TEMP/model-download.log" 2>&1
          echo 'Free model is ready.'
      - name: Run independent incident worker
        env:
          JOB_1_URL: ${{ secrets.JOB_1_URL }}
        run: python3 worker.py
